    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #f8fafc;
      }

      #root {
        min-height: 100vh;
      }

      .app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(56, 189, 248, 0.15);
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      }

      .loader-brand {
        margin-top: 20px;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>

          style="

          "
        >

          <p style="margin: 0">
            Aplikasi ChanThecno memerlukan JavaScript untuk berjalan. Harap
            aktifkan JavaScript di browser Anda.
          </p>
        </div>
      </noscript>

      <!-- Preloader / Fallback sebelum React Mount -->
      <div class="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-brand">ChanThecno</div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
